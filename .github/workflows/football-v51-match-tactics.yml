name: Football V5.1 Match Tactics

on:
  push:
    paths:
      - '.github/workflows/football-v51-match-tactics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Football V5.1 match tactics
        run: |
          python .github/scripts/football_v51_match_tactics.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          grep -q "getFootballRivalTactics" assets/js/realms/physical-education/sports-minigames.js
          grep -q "PRESSÃO TOTAL" assets/js/realms/physical-education/sports-minigames.js
          grep -q "secondaryClose" assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Futebol V5.1: rival muda de tatica durante a partida"
          git push
