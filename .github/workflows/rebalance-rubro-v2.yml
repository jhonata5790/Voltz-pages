name: Rebalance Rubro V2

on:
  push:
    paths:
      - '.github/workflows/rebalance-rubro-v2.yml'

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebalance Queimada
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/js/realms/physical-education/sports-minigames.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'Bloco não encontrado:\n{old[:180]}')
              s = s.replace(old, new, 1)

          rep('''  const DODGE_CATCH_DISTANCE = 104;\n  const DODGE_CATCH_PERFECT_DISTANCE = 46;\n  const DODGE_CATCH_BUFFER_MS = 160;\n  const DODGE_PLAYER_BASE_SPEED_PX_PER_SECOND = 640;''', '''  const DODGE_CATCH_DISTANCE = 92;\n  const DODGE_CATCH_PERFECT_DISTANCE = 40;\n  const DODGE_CATCH_BUFFER_MS = 140;\n  // Balance V2: 640 px/s atravessava a arena quase instantaneamente.\n  const DODGE_PLAYER_BASE_SPEED_PX_PER_SECOND = 420;\n  const RUBRO_PROJECTILE_SPEED_MULTIPLIER = Object.freeze({ 1: 1.08, 2: 1.18, 3: 1.28 });\n  const RUBRO_DAMAGE_MULTIPLIER = Object.freeze({ 1: 1.00, 2: 1.10, 3: 1.18 });''')

          rep('''    const dx = targetX - x;\n    const dy = targetY - y;\n    const len = Math.hypot(dx, dy) || 1;\n    const ball = {\n      x, y,\n      vx: dx / len * speed,\n      vy: dy / len * speed,''', '''    // Toda bola inimiga passa pelo mesmo balanceamento. Isso também faz o\n    // Apito funcionar de forma consistente em todos os padrões.\n    const phase = getRubroPhase(g);\n    const phaseSpeedMultiplier = isRallyFinal ? 1 : (RUBRO_PROJECTILE_SPEED_MULTIPLIER[phase] || 1);\n    const slowMultiplier = g.enemySlowMultiplier || 1;\n    const effectiveSpeed = speed * phaseSpeedMultiplier * slowMultiplier;\n    const dx = targetX - x;\n    const dy = targetY - y;\n    const len = Math.hypot(dx, dy) || 1;\n    const ball = {\n      x, y,\n      vx: dx / len * effectiveSpeed,\n      vy: dy / len * effectiveSpeed,''')

          rep('''    const incomingDamage = Math.max(1, Math.round(rawDamage || 1));\n    g.playerHp = Math.max(0, g.playerHp - incomingDamage);\n    g.player.invulnerableUntil = now + (g.rallyActive ? 390 : 620);''', '''    const phase = getRubroPhase(g);\n    const damageMultiplier = RUBRO_DAMAGE_MULTIPLIER[phase] || 1;\n    const incomingDamage = Math.max(1, Math.round((rawDamage || 1) * damageMultiplier));\n    g.playerHp = Math.max(0, g.playerHp - incomingDamage);\n    // Menos i-frames impede atravessar uma sequência inteira depois de um único erro.\n    g.player.invulnerableUntil = now + (g.rallyActive ? 330 : 500);''')

          rep('''      const count = g.opponentHp <= 60 ? 2 : 1;''', '''      const count = phase >= 2 ? 2 : 1;''')

          rep('''      const duration = 780 + Math.random() * 140;''', '''      const phase = getRubroPhase(g);\n      const baseDuration = phase === 3 ? 610 : phase === 2 ? 670 : 740;\n      const duration = (baseDuration + Math.random() * 100) / (g.enemySlowMultiplier || 1);''')

          rep('''        speed: 205 + index * 16,\n        style: "chaos-bounce",\n        catchable: false,\n        damage: event.damage || 9,\n        bounceAll: true,\n        accelerationPerSecond: .16,\n        maxSpeed: 560,''', '''        speed: 205 + index * 16,\n        style: "chaos-bounce",\n        catchable: false,\n        damage: event.damage || 9,\n        bounceAll: true,\n        accelerationPerSecond: .20,\n        maxSpeed: 600,''')

          rep('''        speed: 190,\n        style: "siege",''', '''        speed: 215,\n        style: "siege",''')

          rep('''      speed: 120,\n      style: "hunter",\n      catchable: false,\n      damage: event.damage || 11,\n      accelerationPerSecond: .12,\n      maxSpeed: 330,\n      homingStrength: 2.7,''', '''      speed: 145,\n      style: "hunter",\n      catchable: false,\n      damage: event.damage || 11,\n      accelerationPerSecond: .14,\n      maxSpeed: 380,\n      homingStrength: 3.0,''')

          rep('''    const speed = phase >= 3 ? 265 : phase === 2 ? 245 : 225;''', '''    // O multiplicador global de fase é aplicado em createEnemyBall.\n    const speed = 225;''')

          rep('''      explodeAt: now + 1550,''', '''      explodeAt: now + 1400,''')

          rep('''        speed: 245,\n        style: "bomb-fragment",''', '''        speed: 260,\n        style: "bomb-fragment",''')

          rep('''        speed: 290 + Number(event.wave || 0) * 8,''', '''        speed: 305 + Number(event.wave || 0) * 9,''')

          rep('''    const slow = g.enemySlowMultiplier || 1;\n    const phase = getRubroPhase(g);\n    const phaseSpeed = phase === 3 ? 1.1 : phase === 2 ? 1.04 : 1;\n    const damage = event.damage ?? (event.style === "power" ? 24 : event.style === "curve" ? 16 : event.style === "ricochet" ? 14 : 15);''', '''    const damage = event.damage ?? (event.style === "power" ? 24 : event.style === "curve" ? 16 : event.style === "ricochet" ? 14 : 15);''')

          rep('''speed:300*slow, style:"rally-final"''', '''speed:300, style:"rally-final"''')
          rep('''speed:470*slow*phaseSpeed, style:"power"''', '''speed:470, style:"power"''')
          rep('''speed:295*slow*phaseSpeed, style:"curve"''', '''speed:295, style:"curve"''')
          rep('''speed:330*slow*phaseSpeed, style:"ricochet"''', '''speed:330, style:"ricochet"''')
          rep('''speed:325*slow*phaseSpeed, style:"straight"''', '''speed:325, style:"straight"''')

          rep('''        const slow = g.enemySlowMultiplier || 1;\n        const speed = event.style === "power" ? 480 : event.style === "curve" ? 310 : 340;''', '''        const speed = event.style === "power" ? 480 : event.style === "curve" ? 310 : 340;''')
          rep('''          speed: speed * slow,''', '''          speed,''')

          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check assets/js/realms/physical-education/sports-minigames.js
      - name: Commit balance
        run: |
          git config user.name "jhonata5790"
          git config user.email "jhonatamyrandas5790@gmail.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Balance: Capitão Rubro mais desafiador" || exit 0
          git push
