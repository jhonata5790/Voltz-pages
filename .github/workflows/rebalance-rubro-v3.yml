name: Rebalance Rubro V3

on:
  push:
    paths:
      - '.github/workflows/rebalance-rubro-v3.yml'

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebalance Queimada V3
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/js/realms/physical-education/sports-minigames.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'Bloco não encontrado:\n{old[:220]}')
              s = s.replace(old, new, count)

          rep('''  const DODGE_CATCH_DISTANCE = 92;\n  const DODGE_CATCH_PERFECT_DISTANCE = 40;\n  const DODGE_CATCH_BUFFER_MS = 140;\n  // Balance V2: 640 px/s atravessava a arena quase instantaneamente.\n  const DODGE_PLAYER_BASE_SPEED_PX_PER_SECOND = 420;\n  const RUBRO_PROJECTILE_SPEED_MULTIPLIER = Object.freeze({ 1: 1.08, 2: 1.18, 3: 1.28 });\n  const RUBRO_DAMAGE_MULTIPLIER = Object.freeze({ 1: 1.00, 2: 1.10, 3: 1.18 });''', '''  const DODGE_CATCH_DISTANCE = 82;\n  const DODGE_CATCH_PERFECT_DISTANCE = 34;\n  const DODGE_CATCH_BUFFER_MS = 110;\n  // Balance V3: movimento deliberado. Ainda ágil, mas sem atravessar a arena em um toque.\n  const DODGE_PLAYER_BASE_SPEED_PX_PER_SECOND = 300;\n  const RUBRO_PROJECTILE_SPEED_MULTIPLIER = Object.freeze({ 1: 1.15, 2: 1.32, 3: 1.48 });\n  const RUBRO_DAMAGE_MULTIPLIER = Object.freeze({ 1: 1.00, 2: 1.12, 3: 1.22 });''')

          rep('''    if (phase === 1) {\n      pool = [catalog.bounceTrio, catalog.cornerBarrage, catalog.fallingRain, catalog.wallPassage];\n    } else if (phase === 2) {\n      pool = [\n        catalog.bounceTrio, catalog.cornerBarrage, catalog.fallingRain, catalog.wallPassage,\n        catalog.siege, catalog.hunter, catalog.bomb, catalog.crossfire\n      ];''', '''    if (phase === 1) {\n      // Rubro já começa com variedade real: nada de quatro padrões excessivamente seguros.\n      pool = [catalog.bounceTrio, catalog.cornerBarrage, catalog.fallingRain, catalog.wallPassage, catalog.siege, catalog.crossfire];\n    } else if (phase === 2) {\n      pool = [\n        catalog.bounceTrio, catalog.cornerBarrage, catalog.fallingRain, catalog.wallPassage,\n        catalog.siege, catalog.hunter, catalog.bomb, catalog.crossfire,\n        catalog.mixRainHunter, catalog.mixBombCorner\n      ];''')

          rep('''      add(520, "bounceTrio", { catchAfter: phase >= 2 ? 4300 : 4700, damage: phase >= 2 ? 11 : 9 });''', '''      add(360, "bounceTrio", { catchAfter: phase >= 2 ? 3400 : 3900, damage: phase >= 2 ? 11 : 9 });''')
          rep('''      const count = phase >= 2 ? 2 : 1;\n      [650, 1350, 2050, 2750, 3450, 4150, 4850, 5550].forEach((at) => add(at, "fallingVolley", { count, damage: 8 }));''', '''      const count = phase === 3 ? 3 : 2;\n      [450, 1050, 1650, 2250, 2850, 3450, 4050, 4650, 5250].forEach((at) => add(at, "fallingVolley", { count, damage: 8 }));''')
          rep('''      [650, 1650, 2650, 3650, 4650].forEach((at, index) => add(at, "wallWave", {''', '''      [500, 1300, 2100, 2900, 3700, 4500].forEach((at, index) => add(at, "wallWave", {''')
          rep('''        catchableEdge: index === 4''', '''        catchableEdge: index === 5''')
          rep('''      [1800, 2900, 4000, 5100].forEach((at, index) => add(at, "throw", {''', '''      [1300, 2200, 3100, 4000, 4900, 5800].forEach((at, index) => add(at, "throw", {''')
          rep('''      [650, 1450, 2250, 3050, 3850, 4650, 5450].forEach((at, index) => add(at, "crossfire", {''', '''      [450, 1050, 1650, 2250, 2850, 3450, 4050, 4650, 5250, 5850].forEach((at, index) => add(at, "crossfire", {''')
          rep('''      [900, 1800, 2700, 3600, 4500, 5400, 6300].forEach((at) => add(at, "fallingVolley", { count: 2, damage: 7 }));''', '''      [700, 1450, 2200, 2950, 3700, 4450, 5200, 5950, 6700].forEach((at) => add(at, "fallingVolley", { count: 3, damage: 7 }));''')
          rep('''      [1300, 2600, 3900, 5200, 6500].forEach((at, index) => add(at, "wallWave", {''', '''      [950, 1950, 2950, 3950, 4950, 5950, 6950].forEach((at, index) => add(at, "wallWave", {''')
          rep('''      [1200, 2200, 3200, 4200, 5200, 6200].forEach((at) => add(at, "fallingVolley", { count: 2, damage: 7 }));''', '''      [900, 1700, 2500, 3300, 4100, 4900, 5700, 6500].forEach((at) => add(at, "fallingVolley", { count: 3, damage: 7 }));''')

          rep('''        speed: 205 + index * 16,''', '''        speed: 225 + index * 18,''')
          rep('''        accelerationPerSecond: .20,\n        maxSpeed: 600,''', '''        accelerationPerSecond: .24,\n        maxSpeed: 650,''')
          rep('''      const baseDuration = phase === 3 ? 610 : phase === 2 ? 670 : 740;''', '''      const baseDuration = phase === 3 ? 500 : phase === 2 ? 560 : 640;''')
          rep('''        speed: 215,\n        style: "siege",''', '''        speed: 245,\n        style: "siege",''')
          rep('''      speed: 145,\n      style: "hunter",\n      catchable: false,\n      damage: event.damage || 11,\n      accelerationPerSecond: .14,\n      maxSpeed: 380,\n      homingStrength: 3.0,''', '''      speed: 170,\n      style: "hunter",\n      catchable: false,\n      damage: event.damage || 11,\n      accelerationPerSecond: .18,\n      maxSpeed: 440,\n      homingStrength: 3.4,''')
          rep('''    const gapSize = 2;''', '''    const gapSize = 1;''')
          rep('''    const speed = 225;''', '''    const speed = 245;''')
          rep('''      explodeAt: now + 1400,''', '''      explodeAt: now + 1180,''')
          rep('''        speed: 260,\n        style: "bomb-fragment",''', '''        speed: 285,\n        style: "bomb-fragment",''')
          rep('''    const rows = 5;''', '''    const rows = 6;''')
          rep('''        speed: 305 + Number(event.wave || 0) * 9,''', '''        speed: 330 + Number(event.wave || 0) * 12,''')

          rep('''speed:300, style:"rally-final"''', '''speed:390, style:"rally-final"''')
          rep('''speed:470, style:"power"''', '''speed:520, style:"power"''')
          rep('''speed:295, style:"curve"''', '''speed:330, style:"curve"''')
          rep('''speed:330, style:"ricochet"''', '''speed:370, style:"ricochet"''')
          rep('''speed:325, style:"straight"''', '''speed:360, style:"straight"''')
          rep('''        const speed = event.style === "power" ? 480 : event.style === "curve" ? 310 : 340;''', '''        const speed = event.style === "power" ? 540 : event.style === "curve" ? 350 : 380;''')

          # Rally: menos pausas e mais ocupação de arena em cada trecho.
          rep('''    [7800, 8500, 9200, 9900].forEach((at) => add(at, "fallingVolley", { count: 2, damage: 6 }));''', '''    [7700, 8200, 8700, 9200, 9700, 10200].forEach((at) => add(at, "fallingVolley", { count: 3, damage: 6 }));''')
          rep('''    [18000, 18700, 19400, 20100].forEach((at, index) => add(at, "wallWave", {''', '''    [17900, 18450, 19000, 19550, 20100, 20650].forEach((at, index) => add(at, "wallWave", {''')
          rep('''    [24500, 25100, 25700, 26300].forEach((at, index) => add(at, "crossfire", { wave: index, damage: 5 }));''', '''    [24400, 24800, 25200, 25600, 26000, 26400].forEach((at, index) => add(at, "crossfire", { wave: index, damage: 5 }));''')

          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check assets/js/realms/physical-education/sports-minigames.js
      - name: Commit balance
        run: |
          git config user.name "jhonata5790"
          git config user.email "jhonatamyrandas5790@gmail.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Balance V3: Rubro exige esquiva de verdade" || exit 0
          git push
