name: Volleyball V0.3 Trajectory Defense

on:
  push:
    paths:
      - '.github/workflows/volleyball-v03-trajectory-defense.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply trajectory based defense
        run: |
          python .github/scripts/volleyball_v03_trajectory_defense.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          grep -q 'volleyballEnsureVoltzCoverage' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'FREE BALL!' assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Volei V0.3: defender qualquer bola pela trajetoria"
          git push
