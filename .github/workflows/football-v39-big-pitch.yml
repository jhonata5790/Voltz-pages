name: Football V3.9 Big Pitch

on:
  push:
    paths:
      - '.github/workflows/football-v39-big-pitch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Football V3.9
        run: |
          python .github/scripts/football_v39_big_pitch_manual_switch.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/sports-minigames.css assets/css/football/football-standalone.css
          git commit -m "Futebol V3.9: campo maior gols amplos e troca manual"
          git push
