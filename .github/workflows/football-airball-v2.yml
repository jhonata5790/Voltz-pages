name: Football Airball V2

on:
  push:
    paths:
      - '.github/workflows/football-airball-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/football_airball_v2.py
      - name: Validate JavaScript
        run: node --check assets/js/realms/physical-education/sports-minigames.js
      - name: Commit football V2.1
        run: |
          git config user.name "jhonata5790"
          git config user.email "jhonatamyrandas5790@gmail.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/sports-minigames.css
          git commit -m "Futebol V2.1: cruzamentos e bola aérea" || exit 0
          git push
