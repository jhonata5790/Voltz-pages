name: Mobile and Dev Menu Upgrade

on:
  push:
    paths:
      - '.github/workflows/mobile-devmenu-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply mobile port and dev menu update
        run: |
          python .github/scripts/mobile_devmenu_upgrade.py
          node --check assets/js/mobile-controls.js
          node --check assets/js/dev-menu.js
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          grep -q 'devSetSportCompleted' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'Mobile · teste' assets/js/dev-menu.js
          grep -q 'voltzMobileControls' assets/js/mobile-controls.js
          grep -q 'mobile-controls.css' game.html
          grep -q 'mobile-controls.css' volleyball.html
          grep -q 'mobile-controls.css' football.html
          grep -q 'mobile-controls.css' dodgeball.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/mobile-controls.js assets/css/mobile-controls.css assets/js/dev-menu.js assets/css/dev-menu.css assets/js/realms/physical-education/sports-minigames.js game.html volleyball.html football.html dodgeball.html README_PAINEL_DEV.md
          git commit -m "feat: atualizar painel dev e adicionar port mobile"
          git push
