name: Apply world data cleanup

on:
  push:
    branches:
      - refactor/remove-legacy-world-data

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/remove-legacy-world-data

      - name: Apply cleanup
        run: python .github/scripts/remove_legacy_world_data.py

      - name: Validate JavaScript
        run: |
          node --check assets/js/openworld.js
          node --check assets/js/world/village-data.js
          node --check assets/js/npc/village-npc-data.js
          node --check assets/js/realms/realm-data.js

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/js/openworld.js game.html openworld-test.html
          git rm -- assets/js/main/data-bootstrap.js
          git rm -- .github/refactor-trigger
          git rm -- .github/scripts/remove_legacy_world_data.py
          git rm -- .github/workflows/refactor-remove-legacy-data.yml
          git rm -- .github/workflows/apply-refactor-cleanup.yml

          git commit -m "refactor: consume modular world data directly"
          git push origin HEAD:refactor/remove-legacy-world-data
