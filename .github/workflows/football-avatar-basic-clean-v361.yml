name: Football Avatar Basic Cleanup V3.6.1

on:
  push:
    paths:
      - '.github/workflows/football-avatar-basic-clean-v361.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove remaining avatar limbs
        run: |
          perl -0pi -e 's/\s*<g class="football-arms[^"]*">.*?<\/g>//sg; s/\s*<g class="football-avatar-legs">.*?<\/g>//sg' assets/js/realms/physical-education/sports-minigames.js
          node --check assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Futebol V3.6.1: remover membros restantes do avatar"
          git push
