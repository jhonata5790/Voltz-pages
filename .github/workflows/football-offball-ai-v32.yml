name: Football Offball AI V3.2

on:
  push:
    paths:
      - '.github/workflows/football-offball-ai-v32.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply smart off-ball AI patch
        shell: bash
        run: |
          python .github/scripts/football_offball_ai_v32.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Futebol V3.2: IA sem bola inteligente" || exit 0
          git push
