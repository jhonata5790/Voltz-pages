name: Volleyball Standalone

on:
  push:
    paths:
      - '.github/workflows/volleyball-standalone.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply volleyball standalone migration
        run: |
          python .github/scripts/volleyball_standalone_patch.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          node --check assets/js/openworld.js
          node --check assets/js/volleyball/volleyball-standalone.js
          git diff --check
          grep -q 'VoltzStandaloneVolleyball' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'enterStandaloneVolleyball' assets/js/openworld.js
          grep -q 'volleyball.html' assets/js/openworld.js
          test -f volleyball.html
          test -f assets/css/volleyball/volleyball-standalone.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/js/openworld.js
          git commit -m "Volei V0.1: migrar Quadra da Sequencia para pagina propria"
          git push
