name: Football V4 Real Projection

on:
  push:
    paths:
      - '.github/workflows/football-v40-real-projection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Football V4 projection
        run: |
          python .github/scripts/football_v40_real_projection.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/football/football-standalone.css
          git commit -m "Futebol V4: projecao top-down obliqua real"
          git push
