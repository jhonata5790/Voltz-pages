name: Football Topdown V3

on:
  push:
    paths:
      - '.github/workflows/football-topdown-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate football V3
        run: |
          python .github/scripts/football_topdown_v3.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/sports-minigames.css
          if ! git diff --cached --quiet; then
            git commit -m "Futebol V3: bote manual e leitura top-down"
            git push
          fi
