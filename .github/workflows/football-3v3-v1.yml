          )
          if not pattern.search(s):
              raise SystemExit('Bloco antigo de Futebol não encontrado')
          s = pattern.sub(football_block, s, count=1)

          old_keys = '''    if (key === "space") {\n      event.preventDefault();\n      if (game.type === "football") shootFootball();\n      else if (game.type === "basketball") shootBasketball();\n      else if (game.type === "athletics") athleticsSpace();\n      return;\n    }'''
          new_keys = '''    if (game.type === "football") {\n      if (["j","k","l"].includes(key)) {\n        event.preventDefault();\n        if (!event.repeat) {\n          if (key === "j") shootFootball();\n          else if (key === "k") footballPass();\n          else activateFootballVision();\n        }\n      }\n      return;\n    }\n\n    if (key === "space") {\n      event.preventDefault();\n      if (game.type === "basketball") shootBasketball();\n      else if (game.type === "athletics") athleticsSpace();\n      return;\n    }'''
          if old_keys not in s:
              raise SystemExit('Bloco de teclado não encontrado')
          s = s.replace(old_keys, new_keys, 1)

          old_export = '''    chooseFootballZone,\n    shootFootball,\n    shootBasketball,'''
          new_export = '''    chooseFootballZone,\n    shootFootball,\n    footballPass,\n    activateFootballVision,\n    shootBasketball,'''
          if old_export not in s:
              raise SystemExit('Export do Futebol não encontrado')
          s = s.replace(old_export, new_export, 1)

