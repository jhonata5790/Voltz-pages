name: Football Pace V3.4

on:
  push:
    paths:
      - '.github/workflows/football-pace-v34.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply football pace patch
        run: |
          python .github/scripts/football_pace_v34.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Futebol V3.4: ritmo de jogo mais cadenciado"
          git push
