name: Football V5 Adaptive AI

on:
  push:
    paths:
      - '.github/workflows/football-v50-adaptive-ai.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Football V5 adaptive AI
        run: |
          python .github/scripts/football_v50_adaptive_ai.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          grep -q "footballEnemyThroughPass" assets/js/realms/physical-education/sports-minigames.js
          grep -q "getFootballAdaptiveRead" assets/js/realms/physical-education/sports-minigames.js
          grep -q "voltzAIPresserId" assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Futebol V5: IA coordenada e adaptativa"
          git push
