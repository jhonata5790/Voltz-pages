name: Football Render Optimization V3.7.1

on:
  push:
    paths:
      - '.github/workflows/football-render-opt-v371.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply render optimization
        run: |
          python .github/scripts/football_render_opt_v371.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/sports-minigames.css
          git commit -m "Futebol V3.7.1: otimizar render dos personagens SVG"
          git push
