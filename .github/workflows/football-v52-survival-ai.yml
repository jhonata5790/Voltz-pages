name: Football V5.2 Survival AI

on:
  push:
    paths:
      - '.github/workflows/football-v52-survival-ai.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Football V5.2 survival AI
        run: |
          python .github/scripts/football_v52_survival_ai.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          grep -q "updateFootballDominanceRead" assets/js/realms/physical-education/sports-minigames.js
          grep -q 'id:"lockdown"' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'mode:"cut-lane"' assets/js/realms/physical-education/sports-minigames.js
          grep -q "pressureBroken" assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Futebol V5.2: reagir ao dominio antes do placar"
          git push
