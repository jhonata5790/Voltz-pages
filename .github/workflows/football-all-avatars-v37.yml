name: Football SVG Roster V3.7

on:
  push:
    paths:
      - '.github/workflows/football-all-avatars-v37.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply full SVG roster patch
        run: |
          python .github/scripts/football_all_avatars_v37.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/sports-minigames.css
          git commit -m "Futebol V3.7: elenco completo em SVG simples"
          git push
