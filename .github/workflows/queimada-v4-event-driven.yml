name: Queimada V4 Event Driven

on:
  push:
    paths:
      - '.github/workflows/queimada-v4-event-driven.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Queimada V4
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('assets/js/realms/physical-education/sports-minigames.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'Bloco não encontrado: {old[:180]!r}')
              s = s.replace(old, new, count)

          # Meio-termo de movimento: 300 ficou restritivo, 420 ainda era fácil demais.
          rep('const DODGE_PLAYER_BASE_SPEED_PX_PER_SECOND = 300;', 'const DODGE_PLAYER_BASE_SPEED_PX_PER_SECOND = 360;')
          rep('const RUBRO_PROJECTILE_SPEED_MULTIPLIER = Object.freeze({ 1: 1.15, 2: 1.32, 3: 1.48 });', 'const RUBRO_PROJECTILE_SPEED_MULTIPLIER = Object.freeze({ 1: 1.15, 2: 1.30, 3: 1.42 });')
          rep('const gapSize = 1;', 'const gapSize = 2;')

          # Estado usado para encerrar o padrão somente quando a arena estiver realmente limpa.
          rep('''      defenseEnd: 0,\n      lastSpawn: 0,''', '''      defenseEnd: 0,\n      patternClearSince: 0,\n      lastSpawn: 0,''')
          rep('''    g.enemyAttackDone = false;\n    g.enemyAttackSequence = buildRubroAttackSequence(g, attack);\n    g.defenseEnd = g.enemyAttackStart + attack.duration;''', '''    g.enemyAttackDone = false;\n    g.patternClearSince = 0;\n    g.enemyAttackSequence = buildRubroAttackSequence(g, attack);\n    // V4: o turno não termina por relógio. A sequência precisa resolver de verdade.\n    g.defenseEnd = 0;''')
          rep('''    g.enemyAttackDone = false;\n    g.enemyAttackSequence = buildRallyRubroSequence(g);\n    g.defenseEnd = g.enemyAttackStart + 30000;''', '''    g.enemyAttackDone = false;\n    g.patternClearSince = 0;\n    g.enemyAttackSequence = buildRallyRubroSequence(g);\n    // O Rally também termina quando a última ameaça sair da arena.\n    g.defenseEnd = 0;''')

          # Rebotes e Caçada precisam ter vida própria, sem depender do antigo defenseEnd.
          rep('''        lifeUntil: g.defenseEnd - 180''', '''        lifeUntil: now + Number(event.lifeMs || 5600)''')
          rep('''      lifeUntil: g.defenseEnd - 200''', '''      lifeUntil: now + Number(event.lifeMs || 5900)''')

          # Novos padrões no catálogo.
          marker = '''      mixRainHunter: {\n        id: "mix-rain-hunter",'''
          insert = '''      spiralPressure: {\n        id: "spiral-pressure",\n        label: "Espiral Rubra",\n        duration: 7600,\n        catchable: false,\n        telegraph: "O cerco fecha primeiro. Depois, curvas alternadas obrigam você a girar junto com o espaço livre."\n      },\n      bombCrossfire: {\n        id: "bomb-crossfire",\n        label: "Bombardeio Cruzado",\n        duration: 7800,\n        catchable: false,\n        telegraph: "Uma Bola-Bomba força o deslocamento enquanto linhas laterais cortam as rotas óbvias."\n      },\n      falseCorridor: {\n        id: "false-corridor",\n        label: "Corredor Falso",\n        duration: 7600,\n        catchable: true,\n        telegraph: "As paredes deixam uma passagem, mas Rubro cruza a abertura logo depois. Não corra no automático."\n      },\n\n'''
          if marker not in s:
              raise SystemExit('Marcador do catálogo não encontrado')
          s = s.replace(marker, insert + marker, 1)

          # Pools com variedade nova sem jogar tudo na fase 1.
          rep('''        catalog.siege, catalog.hunter, catalog.bomb, catalog.crossfire,\n        catalog.mixRainHunter, catalog.mixBombCorner\n      ];''', '''        catalog.siege, catalog.hunter, catalog.bomb, catalog.crossfire,\n        catalog.spiralPressure, catalog.falseCorridor,\n        catalog.mixRainHunter, catalog.mixBombCorner\n      ];''')
          rep('''      pool = [catalog.mixRainHunter, catalog.mixBounceWalls, catalog.mixBombCorner, catalog.mixSiegeRain];''', '''      pool = [\n        catalog.mixRainHunter, catalog.mixBounceWalls, catalog.mixBombCorner, catalog.mixSiegeRain,\n        catalog.spiralPressure, catalog.bombCrossfire, catalog.falseCorridor\n      ];''')

          # Sequências novas montadas com o arsenal existente.
          marker2 = '''    } else if (attack.id === "mix-rain-hunter") {'''
          seqs = '''    } else if (attack.id === "spiral-pressure") {\n      add(0, "telegraph", { text: "ESPIRAL RUBRA", side: "center", tone: "ricochet" });\n      add(450, "siege", { damage: 8, catchableReturn: false });\n      [1500, 2300, 3100, 3900, 4700, 5500].forEach((at, index) => add(at, "throw", {\n        style: "curve",\n        side: index % 2 ? "right" : "left",\n        curveDirection: index % 2 ? -1 : 1,\n        catchable: false,\n        damage: 8\n      }));\n\n    } else if (attack.id === "bomb-crossfire") {\n      add(0, "telegraph", { text: "BOMBARDEIO CRUZADO", side: "center", tone: "power" });\n      add(450, "bomb", { damage: 7, fragments: 8 });\n      [1250, 1950, 2650, 3350, 4050, 4750, 5450, 6150].forEach((at, index) => add(at, "crossfire", {\n        wave: index,\n        damage: 7\n      }));\n      add(3900, "bomb", { damage: 7, fragments: 8 });\n\n    } else if (attack.id === "false-corridor") {\n      add(0, "telegraph", { text: "CORREDOR FALSO", side: "center", tone: "combo" });\n      [500, 1550, 2600, 3650, 4700, 5750].forEach((at, index) => {\n        add(at, "wallWave", { wave: index, damage: 8, catchableEdge: index === 5 });\n        if (index < 5) add(at + 430, "crossfire", { wave: index, damage: 6 });\n      });\n\n'''
          if marker2 not in s:
              raise SystemExit('Marcador das sequências não encontrado')
          s = s.replace(marker2, seqs + marker2, 1)

          # Helper de resolução event-driven.
          marker3 = '''  function updateDodgeDefense(now, dt) {'''
          helper = '''  function isRubroPatternResolved(g, now) {\n    if (!g || g.enemyAttackDone) return false;\n    const timelineDone = Array.isArray(g.enemyAttackSequence) && g.enemyAttackSequence.every((event) => event.done);\n    const ballsActive = Array.isArray(g.balls) && g.balls.length > 0;\n    const fallingActive = Array.isArray(g.fallingBalls) && g.fallingBalls.length > 0;\n    const warningsActive = Object.keys(g.warningTargets || {}).length > 0;\n\n    if (!timelineDone || ballsActive || fallingActive || warningsActive) {\n      g.patternClearSince = 0;\n      return false;\n    }\n\n    // Pequena folga visual para o último projétil realmente sair antes de fechar a caixa.\n    if (!g.patternClearSince) g.patternClearSince = now;\n    return now - g.patternClearSince >= 260;\n  }\n\n'''
          if marker3 not in s:
              raise SystemExit('updateDodgeDefense não encontrado')
          s = s.replace(marker3, helper + marker3, 1)

          # Remove o encerramento pelo contador e transforma o readout em status do padrão.
          old = '''    const remaining = Math.max(0, (g.defenseEnd - now) / 1000);\n    const timer = document.getElementById("dodgeTimer");\n    const catchableInRange = g.balls.some((ball) => {\n      if (!ball.catchable) return false;\n      const distance = Math.hypot(ball.x - playerX, ball.y - playerY);\n      return distance <= DODGE_CATCH_DISTANCE;\n    });\n\n    playerEl?.classList.toggle("dodge-catch-ready", catchableInRange || now <= g.catchBufferedUntil);\n    if (timer && !timer.textContent.includes("AGARROU") && !timer.textContent.includes("PERFECT")) {\n      timer.textContent = catchableInRange\n        ? (g.rallyActive ? "ÚLTIMA BOLA · AGARRA! [ESPAÇO]" : "AGARRA! [ESPAÇO]")\n        : `${remaining.toFixed(1)}s · ${g.activePattern?.label || "Esquiva"}`;\n    }\n\n    if (remaining <= 0 && !g.enemyAttackDone) finishRubroDefenseTurn(false);'''
          new = '''    const timer = document.getElementById("dodgeTimer");\n    const catchableInRange = g.balls.some((ball) => {\n      if (!ball.catchable) return false;\n      const distance = Math.hypot(ball.x - playerX, ball.y - playerY);\n      return distance <= DODGE_CATCH_DISTANCE;\n    });\n\n    playerEl?.classList.toggle("dodge-catch-ready", catchableInRange || now <= g.catchBufferedUntil);\n    if (timer && !timer.textContent.includes("AGARROU") && !timer.textContent.includes("PERFECT")) {\n      timer.textContent = catchableInRange\n        ? (g.rallyActive ? "ÚLTIMA BOLA · AGARRA! [ESPAÇO]" : "AGARRA! [ESPAÇO]")\n        : `${g.activePattern?.label || "Esquiva"} · padrão em andamento`;\n    }\n\n    if (isRubroPatternResolved(g, now)) finishRubroDefenseTurn(false);'''
          rep(old, new)

          # Texto da HUD deixa de sugerir tempo.
          rep('''          <span id="dodgeTimer">Leia o movimento...</span>''', '''          <span id="dodgeTimer">Padrão em andamento...</span>''')

          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check assets/js/realms/physical-education/sports-minigames.js
      - name: Commit update
        run: |
          git config user.name "jhonata5790"
          git config user.email "jhonatamyrandas5790@gmail.com"
          git add assets/js/realms/physical-education/sports-minigames.js
          git commit -m "Queimada V4: turnos por resolução e novos ataques" || exit 0
          git push
