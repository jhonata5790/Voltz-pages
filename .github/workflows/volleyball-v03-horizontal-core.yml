name: Volleyball V0.3 Horizontal Core

on:
  push:
    paths:
      - '.github/workflows/volleyball-v03-horizontal-core.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply horizontal volleyball camera
        run: |
          python .github/scripts/volleyball_v03_horizontal_core.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          git diff --check
          grep -q 'volleyballWorldToScreen' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'camera top-down horizontal' assets/css/volleyball/volleyball-standalone.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js assets/css/volleyball/volleyball-standalone.css volleyball.html
          git commit -m "Volei V0.3: camera top-down horizontal"
          git push
