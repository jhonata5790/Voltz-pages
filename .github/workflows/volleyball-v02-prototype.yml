name: Volleyball V0.2 Prototype

on:
  push:
    paths:
      - '.github/workflows/volleyball-v02-prototype.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply volleyball V0.2 prototype
        run: |
          python .github/scripts/volleyball_v02_prototype.py
          node --check assets/js/realms/physical-education/sports-minigames.js
          node --check assets/js/openworld.js
          node --check assets/js/volleyball/volleyball-standalone.js
          git diff --check
          grep -q 'startVolleyballPrototype' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'volleyballPrototypeAction' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'global.VoltzStandaloneSportBridge.enterVolleyball' assets/js/realms/physical-education/sports-minigames.js
          grep -q 'volleyball-v02' game.html
          grep -q 'Volei V0.2 prototype' assets/css/volleyball/volleyball-standalone.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/realms/physical-education/sports-minigames.js game.html volleyball.html assets/css/volleyball/volleyball-standalone.css
          git commit -m "Volei V0.2: corrigir rota e criar tres toques"
          git push
