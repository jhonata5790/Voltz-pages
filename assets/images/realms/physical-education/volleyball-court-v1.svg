<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Quadra da Sequência</title>
  <desc id="desc">Piso futurista de vôlei em perspectiva, com lado visitante em vermelho e lado Voltz em verde-ciano.</desc>
  <defs>
    <clipPath id="courtClip">
      <polygon points="288,0 1312,0 1600,1000 0,1000"/>
    </clipPath>

    <linearGradient id="floorBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2028"/>
      <stop offset="0.5" stop-color="#0a1820"/>
      <stop offset="1" stop-color="#061016"/>
    </linearGradient>
    <linearGradient id="rivalWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a1823" stop-opacity="0.78"/>
      <stop offset="0.62" stop-color="#2a1720" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#15171d" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="voltzWash" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0e453d" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#10332f" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#121b20" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="centerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63f5b5" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#b9fff1" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#e7ffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ff8d9a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff6b7a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nearGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#d8fff3" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#67d9cb" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="microGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d6fff4" stroke-opacity="0.035" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#d6fff4" fill-opacity="0.08"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#courtClip)">
    <rect width="1600" height="1000" fill="url(#floorBase)"/>
    <rect width="800" height="1000" fill="url(#rivalWash)"/>
    <rect x="800" width="800" height="1000" fill="url(#voltzWash)"/>
    <rect width="1600" height="1000" fill="url(#microGrid)" opacity="0.65"/>
    <rect width="1600" height="1000" fill="url(#nearGlow)"/>

    <!-- Faixas de profundidade: o espaçamento aumenta em direção à câmera. -->
    <g fill="none" stroke="#d9fff5" stroke-opacity="0.07" stroke-width="2">
      <path d="M245 115 H1355"/>
      <path d="M205 235 H1395"/>
      <path d="M155 390 H1445"/>
      <path d="M92 585 H1508"/>
      <path d="M20 815 H1580"/>
    </g>

    <!-- Zonas internas com placas translúcidas. -->
    <path d="M300 34 L793 34 L793 956 L28 956 Z" fill="#ff6b7a" fill-opacity="0.035"/>
    <path d="M807 34 L1300 34 L1572 956 L807 956 Z" fill="#63f5b5" fill-opacity="0.045"/>

    <!-- Linha central sob a rede DOM. -->
    <path d="M800 18 V974" stroke="url(#centerGlow)" stroke-width="34" opacity="0.8"/>
    <path d="M800 18 V974" stroke="#efffff" stroke-opacity="0.32" stroke-width="2"/>

    <!-- Linhas de ataque já desenhadas com convergência real. -->
    <g fill="none" stroke-width="3" stroke-dasharray="12 12">
      <path d="M694 32 L526 958" stroke="#ff9ca7" stroke-opacity="0.48"/>
      <path d="M906 32 L1074 958" stroke="#8affcf" stroke-opacity="0.52"/>
    </g>

    <!-- Linhas de serviço / apoio. -->
    <g fill="none" stroke="#d9fff5" stroke-opacity="0.18" stroke-width="2">
      <path d="M332 72 L1268 72"/>
      <path d="M70 924 L1530 924"/>
    </g>

    <!-- Circuitos do time visitante. -->
    <g fill="none" stroke="#ff7d8b" stroke-opacity="0.18" stroke-width="3">
      <path d="M355 170 H470 L505 205 H618"/>
      <path d="M225 665 H390 L430 625 H548"/>
      <path d="M410 820 V752 H480"/>
    </g>
    <g fill="#ff98a3" fill-opacity="0.35">
      <circle cx="355" cy="170" r="5"/><circle cx="618" cy="205" r="5"/>
      <circle cx="225" cy="665" r="5"/><circle cx="548" cy="625" r="5"/>
      <circle cx="410" cy="820" r="5"/>
    </g>

    <!-- Circuitos Voltz. -->
    <g fill="none" stroke="#63f5b5" stroke-opacity="0.2" stroke-width="3">
      <path d="M1245 170 H1130 L1095 205 H982"/>
      <path d="M1375 665 H1210 L1170 625 H1052"/>
      <path d="M1190 820 V752 H1120"/>
    </g>
    <g fill="#8affcf" fill-opacity="0.38">
      <circle cx="1245" cy="170" r="5"/><circle cx="982" cy="205" r="5"/>
      <circle cx="1375" cy="665" r="5"/><circle cx="1052" cy="625" r="5"/>
      <circle cx="1190" cy="820" r="5"/>
    </g>

    <!-- Marca Voltz discreta no primeiro plano. -->
    <path d="M1180 705 L1090 840 H1165 L1118 930 L1275 770 H1197 L1250 705 Z"
          fill="#7fffd0" fill-opacity="0.055" stroke="#8affcf" stroke-opacity="0.12" stroke-width="3"/>

    <!-- Marca rival abstrata para equilibrar a composição. -->
    <g transform="translate(310 760)" opacity="0.07" fill="none" stroke="#ff8694" stroke-width="10">
      <path d="M0 75 L70 0 L140 75 L70 150 Z"/>
      <path d="M40 75 H100"/>
    </g>

    <!-- Luzes laterais em perspectiva. -->
    <g filter="url(#softGlow)">
      <path d="M282 18 L10 970" stroke="#ff6b7a" stroke-opacity="0.19" stroke-width="9"/>
      <path d="M1318 18 L1590 970" stroke="#63f5b5" stroke-opacity="0.22" stroke-width="9"/>
    </g>

    <!-- Pequenos pads tecnológicos nas bordas. -->
    <g fill="#f2ffff" fill-opacity="0.34">
      <rect x="314" y="46" width="38" height="5" rx="2.5"/>
      <rect x="1248" y="46" width="38" height="5" rx="2.5"/>
      <rect x="56" y="887" width="70" height="7" rx="3.5"/>
      <rect x="1474" y="887" width="70" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- Contorno principal fica fora do clip para permanecer nítido. -->
  <polygon points="288,2 1312,2 1597,998 3,998" fill="none" stroke="#c6fff0" stroke-opacity="0.52" stroke-width="5" filter="url(#lineGlow)"/>
  <polygon points="302,20 1298,20 1567,970 33,970" fill="none" stroke="#eafff8" stroke-opacity="0.16" stroke-width="2"/>
</svg>